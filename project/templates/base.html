<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Vegetarian recipe ideas matched to ingredients in your kitchen.">
    <title>{% block title %}Suggest Recipe{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cyber-bistro.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body class="dew-page veg-theme">
    <div class="dew-bg" aria-hidden="true">
        <span class="dew-orb dew-orb--leaf"></span>
        <span class="dew-orb dew-orb--honey"></span>
        <span class="dew-orb dew-orb--cream"></span>
        <span class="dew-bg__pattern"></span>
    </div>

    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="{{ url_for('ingredients.ingredients') }}">
                <span class="brand__mark" aria-hidden="true">SR</span>
                <span class="brand__text">
                    <span class="brand__name">Suggest Recipe</span>
                    <span class="brand__tagline">Vegetarian recipes from your pantry</span>
                </span>
            </a>
            <nav class="site-nav" aria-label="Primary">
                <a class="site-nav__link{% if request.endpoint == 'ingredients.ingredients' %} is-active{% endif %}"
                   href="{{ url_for('ingredients.ingredients') }}">Pantry</a>
            </nav>
        </div>
    </header>

    <main class="site-main" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p class="site-footer__text">
            Crafted with care by <strong>Ranjith K S</strong>
        </p>
        <p class="site-footer__disclaimer">
            Hobby project only — no promotion or endorsement intended.
        </p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
